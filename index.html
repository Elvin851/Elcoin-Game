<!doctype html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>ELCOIN</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f1220;
  color:white;
  font-family:Arial,sans-serif;
}

.app{
  max-width:520px;
  margin:auto;
  padding:25px 16px;
  text-align:center;
}

h1{
  font-size:34px;
  margin:5px 0;
}

.sub{
  color:#9da5b8;
}

.user{
  color:#52d68a;
  margin-top:8px;
}

.balance{
  font-size:30px;
  font-weight:bold;
  margin:28px 0 18px;
}

.coin{
  width:225px;
  height:225px;
  border-radius:50%;
  margin:auto;
  background:#e5b72f;
  border:7px solid #ffd95a;
  box-shadow:0 10px 35px #0008;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:manipulation;
  user-select:none;
  cursor:pointer;
}

.coin:active{
  transform:scale(.94);
}

.coin span{
  font-size:72px;
}

.energy{
  margin:22px 0;
  color:#bbc2d0;
}

.bar{
  height:12px;
  background:#292e40;
  border-radius:20px;
  margin-top:8px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:#52d68a;
  border-radius:20px;
  width:100%;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  background:#191e2d;
  border-radius:16px;
  padding:15px;
}

.card b{
  display:block;
  font-size:17px;
  margin-bottom:8px;
}

.card button{
  border:0;
  border-radius:10px;
  padding:10px;
  width:100%;
  font-weight:bold;
  background:#f3c63d;
  color:#111;
  margin-top:8px;
}

.msg{
  min-height:24px;
  color:#f3c63d;
  margin-bottom:8px;
}
</style>
</head>

<body>

<div class="app">

<h1>🪙 ELCOIN</h1>

<div class="sub">
Tap-to-Earn
</div>

<div class="user" id="user">
Telegram
</div>

<div class="balance">
<span id="balance">0</span> ELCOIN
</div>

<div class="coin" id="coin">
<span>🪙</span>
</div>

<div class="energy">
⚡ Energy:
<b id="energy">1000</b>/1000

<div class="bar">
<div class="fill" id="fill"></div>
</div>

</div>

<div class="msg" id="msg"></div>

<div class="grid">

<div class="card">
<b>🎁 Daily Bonus</b>
<button id="bonus">+500 Claim</button>
</div>

<div class="card">
<b>📈 Upgrade</b>
Level <span id="level">1</span>
<button id="upgrade">Upgrade 100</button>
</div>

<div class="card">
<b>👥 Friends</b>
<span id="friends">0 referrals</span>
</div>

<div class="card">
<b>🏆 Leaderboard</b>
<span>Coming soon</span>
</div>

</div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const user =
  tg.initDataUnsafe &&
  tg.initDataUnsafe.user;

const FUNCTION_URL =
"https://umqlgklqpolmiqoyqkbu.supabase.co/functions/v1/telegram-user";


/* USER */

if(user){

  document.getElementById("user").textContent =
    "👤 " + (user.first_name || "Player");

}


/* GAME DATA */

let game = {

  balance:0,

  energy:1000,

  level:1,

  lastBonus:0,

  referrals:0

};

let connected = false;

let saving = false;

const maxEnergy = 1000;


/* MESSAGE */

function message(text){

  document.getElementById("msg").textContent = text;

  setTimeout(function(){

    document.getElementById("msg").textContent = "";

  },1800);

}


/* RENDER */

function render(){

  document.getElementById("balance").textContent =
    Math.floor(game.balance);

  document.getElementById("energy").textContent =
    Math.floor(game.energy);

  document.getElementById("level").textContent =
    game.level;

  document.getElementById("friends").textContent =
    game.referrals + " referrals";

  document.getElementById("fill").style.width =
    Math.max(
      0,
      Math.min(
        100,
        game.energy / maxEnergy * 100
      )
    ) + "%";

  document.getElementById("upgrade").textContent =
    "Upgrade " + (game.level * 100);

}


/* SERVER */

async function requestServer(data){

  if(!user){

    return null;

  }

  try{

    const response = await fetch(
      FUNCTION_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          user:{
            id:user.id,
            username:user.username || null,
            first_name:user.first_name || "Player"
          },

          game:data || null

        })

      }
    );

    const text = await response.text();

    let result;

    try{

      result = JSON.parse(text);

    }catch(error){

      console.log("SERVER RESPONSE:",text);

      return null;

    }

    console.log("ELCOIN SERVER:",result);

    return result;

  }catch(error){

    console.log("SERVER ERROR:",error);

    return null;

  }

}


/* CONNECT */

async function connectUser(){

  if(!user){

    message("⚠️ Telegram daxilində açılmalıdır.");

    return;

  }

  message("⏳ Hesab qoşulur...");

  const data = await requestServer(null);

  if(
    data &&
    data.success &&
    data.player
  ){

    game.balance =
      Number(data.player.balance) || 0;

    game.energy =
      Number(data.player.energy) || 1000;

    game.level =
      Number(data.player.level) || 1;

    game.lastBonus =
      data.player.last_bonus
      ? new Date(data.player.last_bonus).getTime()
      : 0;

    game.referrals =
      Number(data.player.referrals) || 0;

    connected = true;

    render();

    message("✅ Hesab qoşuldu!");

  }else{

    connected = false;

    render();

    message("⚠️ Serverə qoşulmadı.");

    console.log("CONNECT ERROR:",data);

  }

}


/* SAVE */

async function saveGame(){

  if(
    !connected ||
    !user ||
    saving
  ){

    return;

  }

  saving = true;

  const data = await requestServer({

    balance:game.balance,

    energy:game.energy,

    level:game.level,

    last_bonus:
      game.lastBonus
      ? new Date(game.lastBonus).toISOString()
      : null,

    referrals:game.referrals

  });

  saving = false;

  if(
    data &&
    data.success &&
    data.player
  ){

    game.balance =
      Number(data.player.balance) || game.balance;

    game.energy =
      Number(data.player.energy) || game.energy;

    game.level =
      Number(data.player.level) || game.level;

    game.referrals =
      Number(data.player.referrals) || game.referrals;

    render();

  }

}


/* COIN */

document.getElementById("coin").onclick =
async function(){

  if(!connected){

    message("⏳ Hesab qoşulur...");

    return;

  }

  if(game.energy < 1){

    message("⚡ Enerjin bitib!");

    return;

  }

  game.balance += game.level;

  game.energy--;

  render();

  await saveGame();

};


/* DAILY BONUS */

document.getElementById("bonus").onclick =
async function(){

  if(!connected){

    message("⏳ Hesab qoşulur...");

    return;

  }

  if(
    game.lastBonus &&
    Date.now() - game.lastBonus < 86400000
  ){

    message("🎁 Bonus artıq götürülüb.");

    return;

  }

  game.balance += 500;

  game.lastBonus = Date.now();

  render();

  await saveGame();

  message("+500 ELCOIN! 🎉");

};


/* UPGRADE */

document.getElementById("upgrade").onclick =
async function(){

  if(!connected){

    message("⏳ Hesab qoşulur...");

    return;

  }

  const cost = game.level * 100;

  if(game.balance < cost){

    message("🪙 Kifayət qədər coin yoxdur.");

    return;

  }

  game.balance -= cost;

  game.level++;

  render();

  await saveGame();

  message("📈 Level yüksəldi!");

};


/* ENERGY */

setInterval(
async function(){

  if(
    connected &&
    game.energy < maxEnergy
  ){

    game.energy++;

    render();

    await saveGame();

  }

},3000);


/* START */

render();

connectUser();

</script>

</body>
</html>
