<!doctype html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ELCOIN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1220;color:#fff;font-family:Arial,sans-serif}
.app{max-width:520px;margin:auto;padding:25px 16px;text-align:center}
h1{font-size:34px;margin:5px 0}.sub{color:#9da5b8}
.balance{font-size:30px;font-weight:bold;margin:28px 0 18px}
.coin{width:225px;height:225px;border-radius:50%;margin:auto;background:#e5b72f;border:7px solid #ffd95a;box-shadow:0 10px 35px #0008;display:flex;align-items:center;justify-content:center;touch-action:manipulation;user-select:none}
.coin:active{transform:scale(.94)}.coin span{font-size:72px}
.energy{margin:22px 0;color:#bbc2d0}.bar{height:12px;background:#292e40;border-radius:20px;margin-top:8px}.fill{height:100%;background:#52d68a;border-radius:20px;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#191e2d;border-radius:16px;padding:15px}.card b{display:block;font-size:17px;margin-bottom:8px}.card button{border:0;border-radius:10px;padding:10px;width:100%;font-weight:bold;background:#f3c63d;color:#111}
.msg{height:24px;color:#f3c63d}
</style>
</head>
<body>
<div class="app">
<h1>🪙 ELCOIN</h1><div class="sub">Tap-to-Earn</div>
<div class="balance"><span id="balance">0</span> ELCOIN</div>
<div class="coin" id="coin"><span>🪙</span></div>
<div class="energy">⚡ Energy: <b id="energy">1000</b>/1000<div class="bar"><div class="fill" id="fill"></div></div></div>
<div class="msg" id="msg"></div>
<div class="grid">
<div class="card"><b>🎁 Daily Bonus</b><button id="bonus">+500 Claim</button></div>
<div class="card"><b>📈 Upgrade</b>Level <span id="level">1</span><button id="upgrade">Upgrade</button></div>
<div class="card"><b>👥 Friends</b><span id="friends">0 referrals</span></div>
<div class="card"><b>🏆 Leaderboard</b><span>Coming soon</span></div>
</div>
</div>
<script>
const KEY="elcoin_save";
let s=JSON.parse(localStorage.getItem(KEY)||"null")||{balance:0,energy:1000,level:1,lastBonus:0,referrals:0};
const max=1000;
function render(){balance.textContent=s.balance;energy.textContent=s.energy;level.textContent=s.level;friends.textContent=s.referrals+" referrals";fill.style.width=(s.energy/max*100)+"%";upgrade.textContent="Upgrade "+(s.level*100)}
function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}
function msg(t){document.getElementById("msg").textContent=t;setTimeout(()=>document.getElementById("msg").textContent="",1800)}
coin.onclick=()=>{if(s.energy<1)return msg("⚡ Enerjin bitib!");s.balance+=s.level;s.energy--;save()}
bonus.onclick=()=>{if(Date.now()-s.lastBonus<86400000)return msg("🎁 Bonus artıq götürülüb.");s.balance+=500;s.lastBonus=Date.now();save();msg("+500 ELCOIN!")}
upgrade.onclick=()=>{let cost=s.level*100;if(s.balance<cost)return msg("🪙 Kifayət qədər coin yoxdur.");s.balance-=cost;s.level++;save();msg("📈 Level yüksəldi!")}
setInterval(()=>{if(s.energy<max){s.energy++;save()}},3000);
render();
</script>
</body>
</html>
